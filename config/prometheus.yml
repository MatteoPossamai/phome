# Scraping settings; retention and storage are set by scripts/run-prometheus.
# On a replacement phone, update the posserver target to its Tailscale IP.
# Other device addresses are generated from private data/grafana.env.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /opt/phome/config/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: phone
    static_configs:
      - targets: ['127.0.0.1:9101']

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']

  - job_name: grafana
    file_sd_configs:
      - files: ['/opt/phome/data/grafana-targets.json']

  - job_name: posserver
    scrape_interval: 15s
    scrape_timeout: 3s
    metrics_path: /metrics
    static_configs:
      - targets: ['100.108.243.40:8080'] # Installed phone example; replace as needed.
