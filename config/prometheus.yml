# Scraping settings; retention and storage are set by scripts/run-prometheus.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: phone
    static_configs:
      - targets: ['127.0.0.1:9101']

  - job_name: grafana
    file_sd_configs:
      - files: ['/opt/phome/data/grafana-targets.json']
