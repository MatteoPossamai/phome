[paths]
data = /opt/phome/data/grafana
logs = /opt/phome/data/grafana/logs
plugins = /opt/phome/data/grafana/plugins
provisioning = /opt/phome/config/grafana/provisioning

[server]
# Bind only to the phone's Tailscale address; set in data/grafana.env.
http_addr = ${PHOME_TAILSCALE_IP}
http_port = 3000

[security]
admin_user = admin
admin_password = ${PHOME_GRAFANA_PASSWORD}
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,zipkin,tempo,cloudwatch,stackdriver,grafana-azure-monitor-datasource

[dashboards]
min_refresh_interval = 5s
default_home_dashboard_path = /opt/phome/config/grafana/dashboards/phone.json

[log]
mode = console
level = warn

[metrics]
enabled = true

[unified_alerting]
enabled = false
